<!-- Script tipo módulo con soporte para extensiones .PARQUET y .parquet -->
    <script type="module">
        import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

        const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        async function loadData() {
            const statusMsg = document.getElementById('status-msg');
            const statusIcon = document.getElementById('status-icon');
            
            try {
                statusMsg.innerText = "Inicializando DuckDB-WASM...";
                
                const DUCKDB_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(DUCKDB_BUNDLES);
                const worker = await duckdb.createWorker(bundle.mainWorker);
                const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
                await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
                const conn = await db.connect();

                statusMsg.innerText = "Cargando archivos Parquet (.PARQUET) desde el repositorio...";

                let archivosVentas = [];
                let archivosRemisiones = [];

                for (const mes of MESES) {
                    // Variantes de rutas para soportar .PARQUET y .parquet
                    const posVentas = [`./${mes}_ventas.PARQUET`, `./${mes}_ventas.parquet`, `./${mes}_Ventas.PARQUET`, `./${mes}_Ventas.parquet`];
                    const posRem = [`./${mes}_Remisiones.PARQUET`, `./${mes}_Remisiones.parquet`, `./${mes}_remisiones.PARQUET`, `./${mes}_remisiones.parquet`];

                    // Probar cuál variante de ventas existe en GitHub Pages
                    for (const url of posVentas) {
                        try {
                            await db.registerFileURL(`v_${mes}.parquet`, url, duckdb.DuckDBDataProtocol.HTTP, false);
                            await conn.query(`SELECT 1 FROM 'v_${mes}.parquet' LIMIT 1`);
                            archivosVentas.push(`'v_${mes}.parquet'`);
                            break;
                        } catch (e) {}
                    }

                    // Probar cuál variante de remisiones existe en GitHub Pages
                    for (const url of posRem) {
                        try {
                            await db.registerFileURL(`r_${mes}.parquet`, url, duckdb.DuckDBDataProtocol.HTTP, false);
                            await conn.query(`SELECT 1 FROM 'r_${mes}.parquet' LIMIT 1`);
                            archivosRemisiones.push(`'r_${mes}.parquet'`);
                            break;
                        } catch (e) {}
                    }
                }

                if (archivosVentas.length === 0) {
                    throw new Error("No se pudo conectar con los archivos .PARQUET del repositorio.");
                }

                const queryVentas = `SELECT * FROM read_parquet([${archivosVentas.join(',')}]) LIMIT 50`;
                const resVentas = await conn.query(queryVentas);
                const arrayVentas = resVentas.toArray().map(r => r.toJSON());

                let cntRem = 0;
                if (archivosRemisiones.length > 0) {
                    const queryRem = `SELECT COUNT(*) as total FROM read_parquet([${archivosRemisiones.join(',')}])`;
                    const resRem = await conn.query(queryRem);
                    cntRem = resRem.toArray()[0].toJSON().total;
                }

                document.getElementById('cnt-fact').innerText = arrayVentas.length;
                document.getElementById('cnt-rem').innerText = cntRem;

                if (arrayVentas.length > 0) {
                    const keys = Object.keys(arrayVentas[0]);
                    document.getElementById('tbl-header').innerHTML = keys.map(k => `<th class="p-2">${k}</th>`).join('');
                    document.getElementById('tbl-body').innerHTML = arrayVentas.map(row => {
                        return `<tr>${keys.map(k => `<td class="p-2">${row[k] ?? ''}</td>`).join('')}</tr>`;
                    }).join('');
                }

                statusIcon.className = "fa-solid fa-circle-check text-emerald-600";
                statusMsg.innerText = `¡Éxito! Se reconocieron ${archivosVentas.length} meses de ventas y ${archivosRemisiones.length} meses de remisiones.`;

            } catch (err) {
                console.error("Error al cargar Parquet:", err);
                statusIcon.className = "fa-solid fa-circle-xmark text-red-600";
                statusMsg.innerText = err.message || "Error al leer Parquet.";
            }
        }

        document.getElementById('btn-reload').addEventListener('click', loadData);
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
