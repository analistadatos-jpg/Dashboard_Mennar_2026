<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENNAR S.A.S - Panel de Analítica 2026 (Parquet Engine)</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: { extend: { colors: { mennar: { blue: '#003366', lightBlue: '#1e88e5', green: '#2e7d32', bg: '#f4f6f9' } } } }
        }
    </script>
    <style>
        body { background-color: #f4f6f9; color: #212121; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card-shadow { box-shadow: 0 2px 8px rgba(0, 51, 102, 0.08); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .num { font-variant-numeric: tabular-nums; }
        tbody tr:hover { background: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-mennar-blue text-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white text-mennar-blue font-black rounded-lg w-8 h-8 flex items-center justify-center shadow">M</div>
                <div>
                    <h1 class="text-lg font-bold leading-none">MENNAR S.A.S — Dashboard 2026</h1>
                    <p class="text-[11px] text-blue-200">Motor Parquet de Alta Velocidad (DuckDB-WASM)</p>
                </div>
            </div>
            <button id="btn-reload" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs px-3 py-1.5 rounded flex items-center gap-1.5 transition">
                <i class="fa-solid fa-rotate"></i>
                <span>Recargar Parquet</span>
            </button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 mt-3 w-full">
        <div class="bg-white p-3 rounded-lg border card-shadow flex justify-between items-center text-xs">
            <div class="flex items-center gap-2">
                <i id="status-icon" class="fa-solid fa-spinner fa-spin text-blue-600"></i>
                <span id="status-msg" class="font-medium text-gray-700">Cargando módulos DuckDB...</span>
            </div>
            <div class="flex gap-4 font-bold">
                <span class="text-blue-700">Ventas: <span id="cnt-fact" class="num">0</span> reg</span>
                <span class="text-amber-700">Remisiones: <span id="cnt-rem" class="num">0</span> reg</span>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-3 w-full flex-grow space-y-4">
        <section class="bg-white rounded-lg card-shadow p-4">
            <h3 class="text-sm font-bold text-mennar-blue mb-2"><i class="fa-solid fa-table mr-2"></i>Vista Previa de Ventas Consolidadas Parquet</h3>
            <div class="overflow-x-auto max-h-[400px]">
                <table class="w-full text-left text-xs">
                    <thead class="bg-mennar-blue text-white sticky top-0">
                        <tr id="tbl-header"></tr>
                    </thead>
                    <tbody id="tbl-body" class="divide-y"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Script tipo módulo para importar DuckDB-WASM correctamente -->
    <script type="module">
        import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

        const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        async function loadData() {
            const statusMsg = document.getElementById('status-msg');
            const statusIcon = document.getElementById('status-icon');
            
            try {
                statusMsg.innerText = "Inicializando DuckDB-WASM...";
                
                const DUCKDB_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(DUCKDB_BUNDLES);
                const worker = await duckdb.createWorker(bundle.mainWorker);
                const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
                await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
                const conn = await db.connect();

                statusMsg.innerText = "Cargando archivos Parquet desde el repositorio...";

                let archivosVentas = [];
                let archivosRemisiones = [];

                for (const mes of MESES) {
                    const fileVentas = `./${mes}_ventas.parquet`;
                    const fileRem = `./${mes}_Remisiones.parquet`;

                    try {
                        await db.registerFileURL(`v_${mes}.parquet`, fileVentas, duckdb.DuckDBDataProtocol.HTTP, false);
                        await conn.query(`SELECT 1 FROM 'v_${mes}.parquet' LIMIT 1`);
                        archivosVentas.push(`'v_${mes}.parquet'`);
                    } catch (e) {}

                    try {
                        await db.registerFileURL(`r_${mes}.parquet`, fileRem, duckdb.DuckDBDataProtocol.HTTP, false);
                        await conn.query(`SELECT 1 FROM 'r_${mes}.parquet' LIMIT 1`);
                        archivosRemisiones.push(`'r_${mes}.parquet'`);
                    } catch (e) {}
                }

                if (archivosVentas.length === 0) {
                    throw new Error("No se encontraron archivos Parquet en el repositorio.");
                }

                const queryVentas = `SELECT * FROM read_parquet([${archivosVentas.join(',')}]) LIMIT 50`;
                const resVentas = await conn.query(queryVentas);
                const arrayVentas = resVentas.toArray().map(r => r.toJSON());

                let cntRem = 0;
                if (archivosRemisiones.length > 0) {
                    const queryRem = `SELECT COUNT(*) as total FROM read_parquet([${archivosRemisiones.join(',')}])`;
                    const resRem = await conn.query(queryRem);
                    cntRem = resRem.toArray()[0].toJSON().total;
                }

                document.getElementById('cnt-fact').innerText = arrayVentas.length;
                document.getElementById('cnt-rem').innerText = cntRem;

                if (arrayVentas.length > 0) {
                    const keys = Object.keys(arrayVentas[0]);
                    document.getElementById('tbl-header').innerHTML = keys.map(k => `<th class="p-2">${k}</th>`).join('');
                    document.getElementById('tbl-body').innerHTML = arrayVentas.map(row => {
                        return `<tr>${keys.map(k => `<td class="p-2">${row[k] ?? ''}</td>`).join('')}</tr>`;
                    }).join('');
                }

                statusIcon.className = "fa-solid fa-circle-check text-emerald-600";
                statusMsg.innerText = `¡Se cargaron ${archivosVentas.length} meses de ventas y ${archivosRemisiones.length} meses de remisiones en Parquet!`;

            } catch (err) {
                console.error("Error al cargar Parquet:", err);
                statusIcon.className = "fa-solid fa-circle-xmark text-red-600";
                statusMsg.innerText = err.message || "Error al leer Parquet.";
            }
        }

        document.getElementById('btn-reload').addEventListener('click', loadData);
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
